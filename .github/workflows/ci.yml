name: ci

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Unit tests
        run: npm test --if-present

      - name: Production build
        run: npm run build

      # Design gates (verify_responsive etc.) self-skip when playwright is
      # absent; install it in CI to enforce them:
      #   npx playwright install chromium --with-deps
      - name: Responsive gate (optional, self-skips without playwright)
        run: node scripts/verify_responsive.mjs src || true
