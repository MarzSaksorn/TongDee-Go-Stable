services:
  tongdee-go:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
        GOOGLE_MAPS_PLATFORM_KEY: ${GOOGLE_MAPS_PLATFORM_KEY:-}
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3002
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_WEATHER_API_KEY: ${GOOGLE_WEATHER_API_KEY:-}
      HOME_WEATHER_LOCATION_NAME: ${HOME_WEATHER_LOCATION_NAME:-}
      HOME_WEATHER_LAT: ${HOME_WEATHER_LAT:-}
      HOME_WEATHER_LNG: ${HOME_WEATHER_LNG:-}
    ports:
      - "127.0.0.1:${HOST_PORT:-3002}:3002"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3002/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
